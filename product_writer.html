<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍩 호두의 콘텐츠 제작소</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3e;
      --accent: #7c6fcd;
      --accent2: #9d8fe0;
      --text: #e8e8f0;
      --text2: #9898b0;
      --text3: #5a5a72;
      --blog: #4ade80;
      --brunch: #f97316;
      --linkedin: #60a5fa;
      --insta: #f472b6;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent2); }
    .api-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all .2s;
    }
    .api-btn:hover { border-color: var(--accent); color: var(--text); }
    .api-btn.set { border-color: #4ade8060; color: #4ade80; }

    /* ── Container ── */
    .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }

    /* ── Section titles ── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* ── Category pills ── */
    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .cat-pill {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      transition: all .2s;
      user-select: none;
    }
    .cat-pill:hover { border-color: var(--accent); color: var(--text); }
    .cat-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ── Main CTA button ── */
    .cta-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, #5b4faa 100%);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .cta-btn:hover { opacity: .9; transform: translateY(-1px); }
    .cta-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .cta-btn .spinner {
      width: 18px; height: 18px;
      border: 2px solid #ffffff60;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Product grid ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    .product-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent)10, transparent);
      opacity: 0;
      transition: opacity .2s;
    }
    .product-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .product-card:hover::before { opacity: 1; }
    .product-card.selected {
      border-color: var(--accent);
      background: var(--surface2);
    }
    .product-card .cat-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--accent)30;
      color: var(--accent2);
      margin-bottom: 10px;
    }
    .product-card .product-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .product-card .product-brand {
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 8px;
    }
    .product-card .product-reason {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.5;
    }
    .product-card .price-range {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text3);
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    /* ── Platform selector ── */
    .platform-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .selected-product-label {
      font-size: 13px;
      color: var(--text3);
      margin-bottom: 6px;
    }
    .selected-product-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }
    .platform-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .platform-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all .2s;
      text-align: center;
    }
    .platform-btn:hover, .platform-btn.active { color: #fff; transform: translateY(-1px); }
    .platform-btn[data-p="blog"]:hover, .platform-btn[data-p="blog"].active {
      background: #166534; border-color: var(--blog); color: var(--blog);
    }
    .platform-btn[data-p="brunch"]:hover, .platform-btn[data-p="brunch"].active {
      background: #7c2d12; border-color: var(--brunch); color: var(--brunch);
    }
    .platform-btn[data-p="linkedin"]:hover, .platform-btn[data-p="linkedin"].active {
      background: #1e3a5f; border-color: var(--linkedin); color: var(--linkedin);
    }
    .platform-btn[data-p="insta"]:hover, .platform-btn[data-p="insta"].active {
      background: #831843; border-color: var(--insta); color: var(--insta);
    }

    /* ── Content output ── */
    .output-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeIn .3s ease;
    }
    .output-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface2);
    }
    .output-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
    }
    .output-actions { display: flex; gap: 8px; }
    .action-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 12px;
      transition: all .2s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--text); }
    .action-btn.copied { border-color: var(--blog); color: var(--blog); }
    .output-content {
      padding: 24px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      min-height: 200px;
      white-space: pre-wrap;
      word-break: keep-all;
    }
    .cursor-blink::after {
      content: '▋';
      color: var(--accent2);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── API Key Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: #00000088;
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 460px;
      max-width: 90vw;
    }
    .modal h2 { font-size: 18px; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
    .modal input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: monospace;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .2s;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal-btns { display: flex; gap: 10px; }
    .btn-save {
      flex: 1; padding: 12px;
      background: var(--accent); border: none;
      border-radius: 8px; color: #fff;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: opacity .2s;
    }
    .btn-save:hover { opacity: .9; }
    .btn-cancel {
      padding: 12px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text2);
      font-size: 14px; cursor: pointer; transition: all .2s;
    }
    .btn-cancel:hover { border-color: var(--text2); color: var(--text); }
    .warning-note {
      background: #7c2d1220;
      border: 1px solid #f9731640;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #fb923c;
      margin-bottom: 16px;
    }

    /* ── Empty/Error state ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text3);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    .hidden { display: none !important; }
    hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">🍩 호두의 <span>콘텐츠 제작소</span></div>
  <button class="api-btn" id="apiBtn" onclick="openModal()">🔑 API 키 설정</button>
</header>

<!-- API Key Modal -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <h2>🔑 Anthropic API 키</h2>
    <p>Claude API 키를 입력하세요. 키는 브라우저 로컬에만 저장되며 외부로 전송되지 않습니다.</p>
    <div class="warning-note">
      ⚠️ API 키가 브라우저에 노출됩니다. 개인 기기에서만 사용하세요.
    </div>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." />
    <div class="modal-btns">
      <button class="btn-save" onclick="saveApiKey()">저장하기</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>

<!-- Main -->
<div class="container">

  <!-- Step 1: Category + CTA -->
  <div class="section-title">카테고리 선택</div>
  <div class="categories">
    <div class="cat-pill active" data-cat="전체" onclick="selectCat(this)">🎯 전체</div>
    <div class="cat-pill" data-cat="카메라" onclick="selectCat(this)">📷 카메라</div>
    <div class="cat-pill" data-cat="전자기기" onclick="selectCat(this)">💻 전자기기</div>
    <div class="cat-pill" data-cat="인테리어" onclick="selectCat(this)">🪴 인테리어 소품</div>
    <div class="cat-pill" data-cat="라이프스타일" onclick="selectCat(this)">✨ 라이프스타일</div>
  </div>

  <button class="cta-btn" id="ctaBtn" onclick="recommendProducts()">
    <span id="ctaBtnText">🎁 제품 추천받기</span>
  </button>

  <!-- Step 2: Product cards -->
  <div id="productsSection" class="hidden">
    <div class="section-title">추천 제품 목록 — 마음에 드는 제품을 선택하세요</div>
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- Step 3: Platform selector -->
  <div class="platform-section hidden" id="platformSection">
    <div class="selected-product-label">선택된 제품</div>
    <div class="selected-product-name" id="selectedProductName"></div>
    <div class="section-title" style="margin-bottom:10px">어느 플랫폼용으로 쓸까요?</div>
    <div class="platform-btns">
      <button class="platform-btn" data-p="blog" onclick="generateContent('blog')">📝 블로그</button>
      <button class="platform-btn" data-p="brunch" onclick="generateContent('brunch')">☕ 브런치</button>
      <button class="platform-btn" data-p="linkedin" onclick="generateContent('linkedin')">💼 링크드인</button>
      <button class="platform-btn" data-p="insta" onclick="generateContent('insta')">📸 인스타그램</button>
    </div>
  </div>

  <!-- Step 4: Output -->
  <div class="output-section hidden" id="outputSection">
    <div class="output-header">
      <div class="output-label" id="outputLabel">생성된 콘텐츠</div>
      <div class="output-actions">
        <button class="action-btn" id="copyBtn" onclick="copyContent()">📋 복사하기</button>
        <button class="action-btn" onclick="resetOutput()">↩ 다시 선택</button>
      </div>
    </div>
    <div class="output-content" id="outputContent"></div>
  </div>

</div>

<script>
// ────────────────────────────────────────
// State
// ────────────────────────────────────────
let selectedCategory = '전체';
let selectedProduct = null;

// ────────────────────────────────────────
// API Key Management
// ────────────────────────────────────────
function getApiKey() { return localStorage.getItem('hodu_api_key') || ''; }

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-ant')) {
    alert('올바른 Anthropic API 키를 입력해주세요 (sk-ant-... 형식)');
    return;
  }
  localStorage.setItem('hodu_api_key', key);
  closeModal();
  updateApiBtn();
}

function openModal() {
  document.getElementById('apiKeyInput').value = getApiKey();
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }

function updateApiBtn() {
  const btn = document.getElementById('apiBtn');
  if (getApiKey()) {
    btn.textContent = '✅ API 키 설정됨';
    btn.classList.add('set');
  } else {
    btn.textContent = '🔑 API 키 설정';
    btn.classList.remove('set');
  }
}

// ────────────────────────────────────────
// Category
// ────────────────────────────────────────
function selectCat(el) {
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  selectedCategory = el.dataset.cat;
}

// ────────────────────────────────────────
// Claude API call (non-streaming)
// ────────────────────────────────────────
async function claudeCall(system, userMessage, maxTokens = 1500) {
  const key = getApiKey();
  if (!key) { openModal(); throw new Error('API 키가 없습니다.'); }

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-6',
      max_tokens: maxTokens,
      system,
      messages: [{ role: 'user', content: userMessage }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 오류 (${res.status})`);
  }

  const data = await res.json();
  return data.content.find(b => b.type === 'text')?.text || '';
}

// ────────────────────────────────────────
// Claude API call (streaming)
// ────────────────────────────────────────
async function claudeStream(system, userMessage, onChunk, maxTokens = 3000) {
  const key = getApiKey();
  if (!key) { openModal(); throw new Error('API 키가 없습니다.'); }

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-6',
      max_tokens: maxTokens,
      stream: true,
      thinking: { type: 'adaptive' },
      system,
      messages: [{ role: 'user', content: userMessage }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 오류 (${res.status})`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const raw = line.slice(6).trim();
      if (raw === '[DONE]') continue;
      try {
        const ev = JSON.parse(raw);
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
          onChunk(ev.delta.text);
        }
      } catch {}
    }
  }
}

// ────────────────────────────────────────
// Step 1: Product Recommendations
// ────────────────────────────────────────
const PRODUCT_SYSTEM = `당신은 콘텐츠 크리에이터 '전정호(호두)'를 위한 제품 큐레이터입니다.
호두는 12년차 시니어 그래픽 디자이너(배민), 얼리어답터이며 카메라·전자기기·인테리어 소품에 관심이 많습니다.
블로그 리뷰 목적(애드포스트 + 협찬 유치)으로 실제 존재하는 제품을 추천해야 합니다.

반드시 아래 JSON 형식으로만 응답하세요 (다른 텍스트 없이):
[
  {
    "name": "제품명",
    "brand": "브랜드",
    "category": "카테고리",
    "price_range": "가격대",
    "reason": "블로그 리뷰로 추천하는 이유 (2~3문장)",
    "keywords": ["키워드1", "키워드2", "키워드3"]
  }
]`;

async function recommendProducts() {
  const btn = document.getElementById('ctaBtn');
  const btnText = document.getElementById('ctaBtnText');

  btn.disabled = true;
  btnText.innerHTML = '<div class="spinner"></div> 제품 추천 중...';

  // Hide previous results
  document.getElementById('productsSection').classList.add('hidden');
  document.getElementById('platformSection').classList.add('hidden');
  document.getElementById('outputSection').classList.add('hidden');

  const catMsg = selectedCategory === '전체'
    ? '카메라, 전자기기, 인테리어 소품 중 최근 트렌디한 제품 6개를 고르게 추천해줘.'
    : `${selectedCategory} 카테고리에서 최근 트렌디하고 블로그 리뷰 콘텐츠로 적합한 제품 6개를 추천해줘.`;

  try {
    const raw = await claudeCall(PRODUCT_SYSTEM, catMsg, 2000);
    // Extract JSON from response
    const jsonMatch = raw.match(/\[[\s\S]*\]/);
    if (!jsonMatch) throw new Error('JSON 파싱 실패');
    const products = JSON.parse(jsonMatch[0]);
    renderProducts(products);
  } catch (e) {
    alert('❌ 오류: ' + e.message);
  } finally {
    btn.disabled = false;
    btnText.textContent = '🎁 제품 추천받기';
  }
}

function renderProducts(products) {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';

  products.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="cat-badge">${p.category}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-brand">${p.brand}</div>
      <div class="product-reason">${p.reason}</div>
      <div class="price-range">💰 ${p.price_range} · ${p.keywords.map(k => `#${k}`).join(' ')}</div>
    `;
    card.addEventListener('click', () => selectProduct(card, p));
    grid.appendChild(card);
  });

  document.getElementById('productsSection').classList.remove('hidden');
}

// ────────────────────────────────────────
// Step 2: Select Product
// ────────────────────────────────────────
function selectProduct(card, product) {
  document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedProduct = product;

  document.getElementById('selectedProductName').textContent = `${product.name} (${product.brand})`;
  document.getElementById('platformSection').classList.remove('hidden');
  document.getElementById('outputSection').classList.add('hidden');

  // Reset platform buttons
  document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));

  // Scroll to platform section
  document.getElementById('platformSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Step 3: Generate Content (streaming)
// ────────────────────────────────────────
async function generateContent(platform) {
  if (!selectedProduct) return;

  // Update platform button state
  document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.platform-btn[data-p="${platform}"]`).classList.add('active');

  const config = PLATFORM_CONFIGS[platform];
  const outputSection = document.getElementById('outputSection');
  const outputContent = document.getElementById('outputContent');
  const outputLabel = document.getElementById('outputLabel');

  outputSection.classList.remove('hidden');
  outputLabel.textContent = `${config.name} 콘텐츠 생성 중...`;
  outputContent.textContent = '';
  outputContent.classList.add('cursor-blink');

  document.getElementById('copyBtn').textContent = '📋 복사하기';
  document.getElementById('copyBtn').classList.remove('copied');

  outputSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const topic = `${selectedProduct.name} (${selectedProduct.brand}) — ${selectedProduct.reason}`;

  let fullText = '';
  try {
    await claudeStream(
      config.system,
      `주제: ${topic}`,
      (chunk) => {
        fullText += chunk;
        outputContent.textContent = fullText;
      },
      3000
    );
    outputLabel.textContent = `${config.name} | ${selectedProduct.name}`;
  } catch (e) {
    outputContent.textContent = '❌ 오류: ' + e.message;
    outputLabel.textContent = '오류 발생';
  } finally {
    outputContent.classList.remove('cursor-blink');
  }
}

// Utilities
// ────────────────────────────────────────
function copyContent() {
  const text = document.getElementById('outputContent').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 복사됨!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 복사하기';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function resetOutput() {
  document.getElementById('outputSection').classList.add('hidden');
  document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('platformSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
